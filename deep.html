<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Deep Dive Library · Invention Lab</title>
  <meta name="description" content="14 giant illustrated stories of the inventions that changed the world, each told in 20 chapters with sources." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📚%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Pacifico&family=Akaya+Kanadaka&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="deep.css" />
</head>
<body>
  <div id="readBar" class="read-bar" aria-hidden="true"><i></i></div>

  <header class="top">
    <a class="logo" href="index.html">💡 Invention Lab</a>
    <nav>
      <a href="index.html">Lab</a>
      <a href="#/">📚 Library</a>
    </nav>
    <div class="text-size" role="group" aria-label="Text size">
      <button class="ts" data-step="-1" title="Smaller text">A−</button>
      <button class="ts" data-step="1" title="Bigger text">A+</button>
    </div>
    <div class="level" role="radiogroup" aria-label="Reading level">
      <button class="lv" data-level="kid" role="radio" title="Short and simple (ages 7–10)">🧒 Kid</button>
      <button class="lv" data-level="explorer" role="radio" title="More detail (ages 10–14)">🧭 Explorer</button>
      <button class="lv" data-level="expert" role="radio" title="The full story (teens & adults)">🎓 Expert</button>
    </div>
  </header>

  <main id="view" class="deep-main" aria-live="polite"></main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <footer class="foot">
    <p>Made by Alan 💡 · Written in our own words, with sources listed in every chapter · Pictures from Wikimedia Commons under free licenses</p>
  </footer>

  <script src="deep/data/library.js"></script>
  <script src="deep.js"></script>
</body>
</html>
